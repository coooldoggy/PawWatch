name: Firebase App Distribution - iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  distribute:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install Bundler
        run: gem install bundler

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Create Google Service Info
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -d > PawWatch/GoogleService-Info.plist

      - name: Create Firebase Admin Key
        run: |
          echo "${{ secrets.FIREBASE_ADMIN_KEY }}" > firebase-admin-key.json

      - name: Install CocoaPods dependencies
        run: |
          cd PawWatch
          pod install

      - name: Install fastlane
        run: sudo gem install fastlane -NV

      - name: Build and Distribute
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        run: |
          cd PawWatch
          fastlane ios distribute

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f PawWatch/GoogleService-Info.plist
          rm -f firebase-admin-key.json

      - name: Notify on Success
        if: success()
        run: echo "✅ Build uploaded to Firebase App Distribution successfully"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Build upload failed"
